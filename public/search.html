<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - The Insight Hub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="/" class="logo-link">
        <div class="logo-icon">IH</div>
        <span>The Insight Hub</span>
    </a>
    <div class="nav-center">
        <a href="/" class="nav-link">Home</a>
        <a href="/#categories" class="nav-link">Categories</a>
        <a href="/#blogs" class="nav-link">Blogs</a>
        <a href="/contact.html" class="nav-link">Contact</a>
    </div>
    <div class="nav-right">
        <div class="search-bar">
            <input type="text" id="navSearchInput" placeholder="Search blogs..." onkeypress="if(event.key==='Enter')navSearch()">
            <button onclick="navSearch()" title="Search">🔍</button>
        </div>
        <button class="theme-toggle" id="themeToggle" title="Toggle Theme">🌙</button>
        <a href="/admin" class="admin-btn-nav">Admin Login</a>
        <button class="menu-btn" onclick="toggleMenu()" aria-label="Menu">☰</button>
    </div>
</nav>

<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
<div class="mobile-menu" id="mobileMenu">
    <button class="menu-close" onclick="toggleMenu()">✕</button>
    <div class="menu-section">
        <h3>Navigation</h3>
        <a href="/" class="menu-item">🏠 Home</a>
        <a href="/#categories" class="menu-item">📂 Categories</a>
        <a href="/#blogs" class="menu-item">📝 Blogs</a>
        <a href="/contact.html" class="menu-item">📧 Contact</a>
    </div>
</div>

<main class="search-hero">
    <h1>Search Results</h1>
    <p class="search-query-text" id="searchQueryText">Searching...</p>
    <div class="blog-grid" id="searchResults" style="margin-top:2rem;">
        <div class="blog-loading">
            <div class="spinner"></div>
            <p>Searching...</p>
        </div>
    </div>
</main>

<footer class="site-footer" style="margin-top:3rem;">
    <div class="footer-bottom" style="border:none; padding:2rem;">
        <p>© <span id="year"></span> The Insight Hub. All rights reserved.</p>
    </div>
</footer>

<script>
(function(){
    const toggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    const saved = localStorage.getItem('theme') || 'dark';
    html.setAttribute('data-theme', saved);
    toggle.textContent = saved === 'dark' ? '🌙' : '☀️';
    toggle.addEventListener('click', () => {
        const current = html.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        toggle.textContent = next === 'dark' ? '🌙' : '☀️';
    });
    document.getElementById('year').textContent = new Date().getFullYear();
})();

function toggleMenu() {
    document.getElementById('mobileMenu').classList.toggle('open');
    document.getElementById('menuOverlay').classList.toggle('show');
}

function navSearch() {
    const q = document.getElementById('navSearchInput').value.trim();
    if(q) window.location.href = '/search.html?q=' + encodeURIComponent(q);
}

function getQueryParam(name) {
    const url = new URL(window.location.href);
    return url.searchParams.get(name) || '';
}

function createBlogCard(blog) {
    const div = document.createElement('div');
    div.className = 'blog-card';
    div.onclick = () => window.location.href = '/blog.html?id=' + blog.id;
    div.innerHTML = `
        <div class="blog-card-img-wrap">
            <img src="${blog.titleImage || '/logo.png'}" alt="${blog.title}" class="blog-card-img" onerror="this.src='/logo.png'">
            <div class="blog-card-overlay"></div>
        </div>
        <div class="blog-card-body">
            <span class="blog-card-tag">${blog.category || 'General'}</span>
            <h3>${blog.title}</h3>
            <p>${blog.content ? blog.content.substring(0, 120).replace(/[#*\\-]/g,'') + '...' : ''}</p>
            <div class="blog-card-meta">
                <span>📅 ${blog.date || ''}</span>
                <span>👁️ ${blog.views || 0}</span>
            </div>
        </div>
    `;
    return div;
}

(async function(){
    const query = getQueryParam('q');
    document.getElementById('searchQueryText').textContent = query ? `Results for "${query}"` : 'Showing all blogs';
    const container = document.getElementById('searchResults');
    try {
        const res = await fetch('/api/blogs');
        const blogs = await res.json();
        const filtered = query ? blogs.filter(b => 
            (b.title && b.title.toLowerCase().includes(query.toLowerCase())) ||
            (b.content && b.content.toLowerCase().includes(query.toLowerCase())) ||
            (b.category && b.category.toLowerCase().includes(query.toLowerCase()))
        ) : blogs;
        container.innerHTML = '';
        if(filtered.length === 0) {
            container.innerHTML = '<div class="empty-state"><p>😕 No blogs found matching your search.</p><a href="/" class="btn-primary" style="margin-top:1rem;">← Back to Home</a></div>';
        } else {
            filtered.forEach(blog => container.appendChild(createBlogCard(blog)));
        }
    } catch(e) {
        container.innerHTML = '<div class="empty-state"><p>⚠️ Failed to load blogs.</p></div>';
    }
})();
</script>
</body>
</html>
