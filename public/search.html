<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search - The Insight Hub</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="logo-link">
      <img src="/logo.png" alt="The Insight Hub">
    </a>
    <div class="nav-right">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search blogs...">
        <button onclick="doSearch()">🔍</button>
      </div>
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>
  </nav>

  <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
  <div class="mobile-menu" id="mobileMenu">
    <button class="menu-close" onclick="toggleMenu()">✕</button>
    <div class="menu-section">
      <h3>Quick Links</h3>
      <a href="/" class="menu-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Home
      </a>
      <a href="/contact" class="menu-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        Contact Us
      </a>
    </div>
  </div>

  <section class="hero" style="padding:3rem 1.5rem 2rem">
    <h1>Search Results</h1>
    <p id="searchQuery" style="color:var(--text-muted)"></p>
  </section>

  <section class="blog-section">
    <div class="blog-grid" id="searchResults"></div>
  </section>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-top">
        <a href="mailto:asitech5info@gmail.com" class="footer-item">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          asitech5info@gmail.com
        </a>
        <a href="https://youtube.com/@howtech_works?si=gXvodLAXQ36FVHMZ" target="_blank" class="footer-yt">
          <svg fill="currentColor" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
          HOW TECH WORKS
        </a>
      </div>
      <p class="footer-copy">© 2026 The Insight Hub. All rights reserved.</p>
    </div>
  </footer>

  <script>
    function toggleMenu() {
      document.getElementById('mobileMenu').classList.toggle('open');
      document.getElementById('menuOverlay').classList.toggle('show');
    }
    function doSearch() {
      const q = document.getElementById('searchInput').value;
      if (q.trim()) location.href = '/search?q=' + encodeURIComponent(q);
    }
    document.getElementById('searchInput')?.addEventListener('keypress', e => { if (e.key === 'Enter') doSearch(); });

    const q = new URLSearchParams(location.search).get('q') || '';
    document.getElementById('searchQuery').textContent = 'Searching for: "' + q + '"';
    document.getElementById('searchInput').value = q;

    fetch('/api/search?q=' + encodeURIComponent(q))
      .then(r => r.json())
      .then(blogs => {
        const grid = document.getElementById('searchResults');
        if (blogs.length === 0) {
          grid.innerHTML = '<div class="empty-state"><p>No blogs found matching your search.</p></div>';
          return;
        }
        grid.innerHTML = blogs.map(b => `
          <div class="blog-card" onclick="location.href='/blog?id=${b.id}'">
            <img src="${b.titleImage || '/logo.png'}" class="blog-card-img" alt="${b.title}">
            <div class="blog-card-body">
              <span class="blog-card-tag">${b.category}</span>
              <h3>${b.title}</h3>
              <div class="blog-card-meta">
                <span>📅 ${b.date}</span>
                <span>👁️ ${b.views || 0}</span>
              </div>
            </div>
          </div>
        `).join('');
      });
  </script>
</body>
</html>
