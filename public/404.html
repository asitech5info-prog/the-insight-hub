<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | The Insight Hub</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .not-found {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .not-found h1 {
      font-size: 6rem;
      font-weight: 800;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .not-found h2 {
      color: var(--text-secondary);
      font-size: 1.3rem;
      margin-bottom: 1.5rem;
    }
    .not-found p {
      color: var(--text-muted);
      margin-bottom: 2rem;
      max-width: 400px;
    }
    .not-found a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--gradient-primary);
      color: white;
      text-decoration: none;
      padding: 0.9rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.3s;
    }
    .not-found a:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(124,58,237,0.3);
    }
    @media (max-width: 768px) {
      .not-found h1 { font-size: 4rem; }
      .not-found h2 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="logo-link">
      <img src="/logo.png" alt="The Insight Hub">
    </a>
    <div class="nav-right">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search blogs...">
        <button onclick="doSearch()">🔍</button>
      </div>
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>
  </nav>

  <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
  <div class="mobile-menu" id="mobileMenu">
    <button class="menu-close" onclick="toggleMenu()">✕</button>
    <div class="menu-section">
      <h3>Quick Links</h3>
      <a href="/" class="menu-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Home
      </a>
      <a href="/search" class="menu-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        Search
      </a>
      <a href="/contact" class="menu-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        Contact Us
      </a>
    </div>
  </div>

  <div class="not-found">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <a href="/">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      Back to Home
    </a>
  </div>

  <script>
    function toggleMenu() {
      document.getElementById('mobileMenu').classList.toggle('open');
      document.getElementById('menuOverlay').classList.toggle('show');
    }
    function doSearch() {
      const q = document.getElementById('searchInput').value;
      if (q.trim()) location.href = '/search?q=' + encodeURIComponent(q);
    }
    document.getElementById('searchInput')?.addEventListener('keypress', e => { if (e.key === 'Enter') doSearch(); });
  </script>
</body>
</html>
